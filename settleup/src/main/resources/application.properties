spring.application.name=settleup

# Hosts like Render tell the app which port to use through the PORT env var.
server.port=${PORT:8080}

# DB_SSLMODE: leave unset locally (same behaviour as before).
# Set it to "require" for managed databases such as Neon or Supabase.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:settleup}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:abc@123}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated list of frontend origins allowed to call this API.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}